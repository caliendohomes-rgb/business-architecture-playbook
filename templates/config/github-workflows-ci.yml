# Copy to .github/workflows/ci.yml in a new project.
# Minimum CI: install, typecheck, build, secret scan. Add a gated dependency-audit job
# once you have a waiver mechanism for advisories with no available fix.
name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Build
        run: npm run build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for likely secrets
        run: |
          set -euo pipefail
          PATTERN='sk_live_[A-Za-z0-9]+|sk_test_[A-Za-z0-9]{20,}|whsec_[A-Za-z0-9]+|-----BEGIN[ A-Z]*PRIVATE KEY-----|SUPABASE_SERVICE_ROLE_KEY\s*=\s*["'"'"']?ey[A-Za-z0-9._-]+'
          MATCHES=$(grep -rEn "$PATTERN" \
            --exclude-dir=node_modules \
            --exclude-dir=.git \
            --exclude-dir=dist \
            --exclude-dir=build \
            --exclude='*.lock' \
            --exclude='package-lock.json' \
            . || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Possible committed secret found:"
            echo "$MATCHES"
            exit 1
          fi
          echo "No obvious secrets found."
